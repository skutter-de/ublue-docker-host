# This is a bootc/rpm-ostree system: the root filesystem is a read-only
# ostree/composefs deployment, not a plain dnf-managed tree. Two of Fedora's
# default cloud-init modules don't fit that model and are disabled here:
#
# - package_update_upgrade_install: runs `dnf -y upgrade` against the booted
#   deployment, which fails outright. Updates on this image happen via
#   `bootc upgrade` / `rpm-ostree upgrade` instead - uCore already does this
#   automatically via rpm-ostreed-automatic.timer.
# - growpart / resizefs: can't map the "/" mountpoint back to a block device
#   through the composefs overlay ("Device '/dev/composefs' did not exist"),
#   so they only ever produce a harmless but noisy warning. The root
#   partition is already sized via disk_config/disk.toml's minsize at image
#   build time; after growing the underlying disk in Proxmox/hardware, resize
#   manually instead (see README.md).
#
# Reproduced from Fedora's /etc/cloud/cloud.cfg module lists, each with the
# unsupported entry removed. cloud-init replaces (not merges) list values, so
# this has to restate each list in full rather than patching single entries.
cloud_init_modules:
  - seed_random
  - bootcmd
  - write_files
  - disk_setup
  - mounts
  - set_hostname
  - update_hostname
  - update_etc_hosts
  - ca_certs
  - rsyslog
  - users_groups
  - ssh
  - set_passwords

cloud_final_modules:
  - write_files_deferred
  - puppet
  - chef
  - ansible
  - mcollective
  - salt_minion
  - reset_rmc
  - scripts_vendor
  - scripts_per_once
  - scripts_per_boot
  - scripts_per_instance
  - scripts_user
  - ssh_authkey_fingerprints
  - keys_to_console
  - install_hotplug
  - phone_home
  - final_message
  - power_state_change
