# Limit cloud-init to the datasources we actually use:
# - NoCloud:     Proxmox's "cloudinit" drive, or a manually attached seed
#                ISO/USB-stick (label "cidata") for bare-metal installs.
# - ConfigDrive: alternate format some tools/hypervisors use for the same idea.
# - None:        fallback so boot never blocks waiting for a datasource -
#                without one attached, cloud-init just does nothing.
datasource_list: [ NoCloud, ConfigDrive, None ]
